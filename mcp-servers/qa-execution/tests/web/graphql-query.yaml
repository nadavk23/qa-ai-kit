name: GraphQL Query Example
url: https://api.example.com/graphql
---
- action: graphql
  query: |
    query GetUser($id: ID!) {
      user(id: $id) {
        id
        name
        email
      }
    }
  variables:
    id: "123"
  operation_name: GetUser
  expected_status: 200
  assert_path: "data.user.name"
  assert_value: "Alice"
