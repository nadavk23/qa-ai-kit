[project]
name = "qa-execution"
version = "0.6.0"
description = "MCP server providing web + API + iOS + Android execution + auto-discovery recon (web & mobile/APK) primitives for QA work (Playwright + Appium + adb + aapt)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "Appium-Python-Client>=4.0.0",
    "selenium>=4.0.0",
]

[project.scripts]
qa-execution = "qa_execution.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa_execution"]
