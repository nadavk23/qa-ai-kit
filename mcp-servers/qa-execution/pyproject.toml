[project]
name = "qa-execution"
version = "0.1.0"
description = "MCP server providing web execution primitives for QA work (Playwright-backed)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
qa-execution = "qa_execution.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa_execution"]
